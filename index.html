<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Разбор тарелки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: test bench — inputs on the left, the bot's answer on the right; one column on phones */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1d2a24; --muted:#5d6b63; --line:#d9e0db;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3efe8;
  --red:#c2412d; --red-soft:#fbe9e5; --amber:#b7791f; --amber-soft:#fbf1df; --green:#2f7d4f; --green-soft:#e4f3ea;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732;
  --accent:#6fbf93; --accent-ink:#0f1612; --accent-soft:#1f3329;
  --red:#ef8a76; --red-soft:#3a201b; --amber:#e6b35c; --amber-soft:#382c17; --green:#79c99a; --green-soft:#1c3226;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732;
  --accent:#6fbf93; --accent-ink:#0f1612; --accent-soft:#1f3329;
  --red:#ef8a76; --red-soft:#3a201b; --amber:#e6b35c; --amber-soft:#382c17; --green:#79c99a; --green-soft:#1c3226;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-size:24px;line-height:1.2;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
label{display:block;font-weight:500;margin-bottom:6px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:13px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:72px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--bg);min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:220px;max-width:100%;border-radius:8px;display:block}
.drop .ph{color:var(--muted)}
.drop .ph b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.photo-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
button.link{border:none;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--red)}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.badge.example{background:var(--amber-soft);color:var(--amber)}
.answer{display:flex;flex-direction:column;gap:6px;min-width:0}
.answer p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.answer .dish{font-weight:600;font-size:16px;margin-bottom:6px}
.answer .crit{padding:8px 12px;border-radius:8px;border-left:4px solid transparent}
.answer .crit.r{background:var(--red-soft);border-left-color:var(--red)}
.answer .crit.y{background:var(--amber-soft);border-left-color:var(--amber)}
.answer .crit.g{background:var(--green-soft);border-left-color:var(--green)}
.answer .gap{height:6px}
.answer .disc{color:var(--muted);font-size:13px}
.answer.thinking{color:var(--muted)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
#promptBox{font:12.5px/1.5 var(--font-mono);min-height:340px;margin-top:10px;white-space:pre;overflow:auto}
.prompt-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.notice{background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.chat-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.topbar .code{display:flex;gap:8px;align-items:center}
.topbar .code input{width:160px;padding:7px 10px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-height:420px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
.msg.me img{display:block;max-width:220px;max-height:220px;border-radius:10px}
.msg.answer-msg{max-width:100%;white-space:normal;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chip{font:inherit;font-weight:500;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;flex:1}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
.answer .gap{height:6px}
.answer li{margin:2px 0}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="chat-wrap">
  <div class="topbar">
    <div>
      <h1>Разбор тарелки</h1>
      <p class="sub">Так бот будет разговаривать с человеком. Каждый разбор — отдельный запрос без памяти о прошлых.</p>
    </div>
    <div class="code"><label for="code" class="hint" style="margin:0">Код доступа</label><input type="text" id="code" placeholder="код"></div>
  </div>

  <div class="chat" id="chat" aria-live="polite"></div>

  <div class="actions">
    <button type="button" id="restart">Новая тарелка</button>
    <button type="button" id="copyAnswer" hidden>Скопировать ответ</button>
    <span class="small" id="meta"></span>
  </div>
  <div class="status err" id="status" role="status"></div>

  <details id="promptDetails" class="panel">
    <summary>Правила оценки (prompt.md)</summary>
    <textarea id="promptBox" spellcheck="false" aria-label="Текст правил" placeholder="Загружаю…"></textarea>
    <div class="prompt-actions">
      <span id="promptState">Исходные правила</span>
      <button type="button" class="link" id="promptReset">Вернуть исходные</button>
    </div>
    <p class="hint" style="margin-top:6px">Правки действуют только у вас в браузере до перезагрузки. Формулировки ответа — в lib/compose.js на GitHub.</p>
  </details>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
  $("code").value = store.get("razbor_code");
  $("code").addEventListener("change", () => store.set("razbor_code", $("code").value.trim()));

  let ORIGINAL = "";
  const promptBox = $("promptBox");
  fetch("/prompt.md").then(r => r.ok ? r.text() : "").then(t => { ORIGINAL = t.trim(); promptBox.value = ORIGINAL; }).catch(() => {});
  const edited = () => ORIGINAL && promptBox.value.trim() !== ORIGINAL;
  promptBox.addEventListener("input", () => { $("promptState").textContent = edited() ? "Правила изменены — разбор пойдёт по вашей версии" : "Исходные правила"; });
  $("promptReset").onclick = () => { promptBox.value = ORIGINAL; $("promptState").textContent = "Исходные правила"; };

  const chat = $("chat");
  let photo = null, answers = {}, lastText = "";

  function scroll(){ chat.lastElementChild?.scrollIntoView({ block: "end", behavior: "smooth" }); }
  function bot(text){ const d = document.createElement("div"); d.className = "msg bot"; d.textContent = text; chat.append(d); scroll(); return d; }
  function me(text){ const d = document.createElement("div"); d.className = "msg me"; d.textContent = text; chat.append(d); scroll(); return d; }
  function clearControls(){ chat.querySelectorAll(".chips,.composer").forEach(n => n.remove()); }
  function chips(options, onPick){
    const w = document.createElement("div"); w.className = "chips";
    options.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = o; b.onclick = () => { clearControls(); me(o); onPick(o); }; w.append(b); });
    chat.append(w); scroll(); return w;
  }
  function textInput(placeholder, onSend, skipLabel){
    const w = document.createElement("div"); w.className = "composer";
    const t = document.createElement("textarea"); t.placeholder = placeholder; t.rows = 2;
    const b = document.createElement("button"); b.type = "button"; b.className = "primary"; b.textContent = "Отправить";
    const send = () => { const v = t.value.trim(); if (!v) { t.focus(); return; } clearControls(); me(v); onSend(v); };
    b.onclick = send;
    t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    w.append(t, b); chat.append(w);
    if (skipLabel) chips([skipLabel], () => onSend(""));
    t.focus(); scroll();
  }

  async function photoToBase64(file){
    const bmp = await createImageBitmap(file);
    const max = 1568, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { media_type: "image/jpeg", data: btoa(s) };
  }

  // ---- сценарий ----
  function start(){
    chat.replaceChildren(); clearControls(); photo = null; answers = {}; lastText = "";
    $("copyAnswer").hidden = true; $("meta").textContent = ""; $("status").textContent = "";
    bot("Здравствуйте! Пришлите фото своей тарелки — разберу её по системе врача-гастроэнтеролога.");
    const w = document.createElement("div"); w.className = "composer";
    const lab = document.createElement("label"); lab.className = "upload"; 
    const btn = document.createElement("span"); btn.className = "chip"; btn.textContent = "📷 Загрузить фото";
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("aria-label", "Фото тарелки");
    lab.append(btn, inp); w.append(lab); chat.append(w);
    inp.addEventListener("change", () => { if (inp.files[0]) gotPhoto(inp.files[0]); });
  }
  document.addEventListener("paste", e => {
    if (photo || !chat.querySelector(".upload")) return;
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    if (item) gotPhoto(item.getAsFile());
  });
  function gotPhoto(file){
    clearControls(); photo = file;
    const d = document.createElement("div"); d.className = "msg me";
    const img = document.createElement("img"); img.alt = "Фото тарелки"; img.src = URL.createObjectURL(file); d.append(img); chat.append(d);
    bot("Что в тарелке? Перечислите всё, включая соус и заправку. Если что-то покупное — напишите название.");
    textInput("Например: гречка, котлета из индейки, салат из огурцов и укропа", v => { answers.what = v; askMeal(); }, "Пусть бот определит по фото");
  }
  function askMeal(){
    bot("Это завтрак, обед, ужин или перекус?");
    chips(["Завтрак", "Обед", "Ужин", "Перекус"], v => { answers.meal = v.toLowerCase(); askDrink(); });
  }
  function askDrink(){
    bot("Что пили во время еды или сразу после?");
    chips(["Ничего", "Тёплую воду", "Холодную воду", "Чай", "Кофе", "Сок или сладкий напиток", "Алкоголь"], v => {
      const map = { "Ничего": "ничего", "Тёплую воду": "тёплая вода, стакан", "Холодную воду": "холодная вода, стакан", "Чай": "чай", "Кофе": "кофе сразу после еды", "Сок или сладкий напиток": "сок или сладкий напиток", "Алкоголь": "алкоголь" };
      answers.drink = map[v] || v; askOil();
    });
  }
  function askOil(){
    bot("На чём готовили?");
    chips(["Не жарили: варка, на пару, запекание", "Подсолнечное масло", "Оливковое масло", "Сливочное масло", "Масло гхи", "Не знаю"], v => { answers.oil = v; askFull(); });
  }
  function askFull(){
    bot("Хватает этой еды до следующего приёма?");
    chips(["Хватает", "Через пару часов тянет перекусить", "Не знаю"], v => { answers.full = v.toLowerCase(); analyze(); });
  }

  function userMessage(){
    const L = [photo ? "[Фото тарелки приложено.]" : "[Фото не приложено.]"];
    L.push("Что в тарелке: " + (answers.what || "не указано, определи по фото"));
    L.push("Приём пищи: " + (answers.meal || "не указано"));
    L.push("Напиток к еде: " + (answers.drink || "не указано"));
    L.push("На чём готовили: " + (answers.oil || "не указано"));
    L.push("Хватает ли до следующего приёма: " + (answers.full || "не указано"));
    return L.join("\n");
  }

  function renderAnswer(text){
    const d = document.createElement("div"); d.className = "msg bot answer-msg"; 
    const box = document.createElement("div"); box.className = "answer"; d.append(box);
    for (const raw of text.replace(/\r/g, "").split("\n")){
      const t = raw.trim();
      if (!t){ if (box.lastChild && !box.lastChild.classList.contains("gap")){ const g = document.createElement("div"); g.className = "gap"; box.append(g); } continue; }
      const p = document.createElement("p");
      if (t.startsWith("🔴")) p.className = "crit r";
      else if (t.startsWith("🟡")) p.className = "crit y";
      else if (t.startsWith("🟢")) p.className = "crit g";
      else if (t.startsWith("🍽")) p.className = "dish";
      else if (t.startsWith("Это не медицинская") || t.startsWith("Разбор по системе")) p.className = "disc";
      p.textContent = t; box.append(p);
    }
    chat.append(d); scroll();
  }

  async function analyze(){
    clearControls();
    const wait = bot("Разбираю тарелку… Обычно 15–40 секунд."); wait.classList.add("typing");
    store.set("razbor_code", $("code").value.trim());
    try {
      const payload = { code: $("code").value.trim(), message: userMessage() };
      if (photo) payload.image = await photoToBase64(photo);
      if (edited()) payload.prompt = promptBox.value;
      const r = await fetch("/api/analyze", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      const data = await r.json().catch(() => ({ error: "Сервер вернул не JSON (код " + r.status + ")." }));
      if (!r.ok) throw new Error(data.error || ("Ошибка " + r.status));
      wait.remove(); lastText = data.text || ""; renderAnswer(lastText);
      $("copyAnswer").hidden = false;
      $("meta").textContent = "За " + data.seconds + " с · " + (data.model || "") + (edited() ? " · по изменённым правилам" : "");
    } catch(err){
      wait.remove(); $("status").textContent = err.message || String(err);
      bot("Не получилось разобрать. Проверьте код доступа и нажмите «Новая тарелка».");
    }
  }

  $("restart").onclick = start;
  $("copyAnswer").onclick = async e => {
    const btn = e.currentTarget, old = btn.textContent;
    try { await navigator.clipboard.writeText(lastText); btn.textContent = "Скопировано"; } catch { btn.textContent = "Не вышло"; }
    setTimeout(() => btn.textContent = old, 1600);
  };
  start();
})();
</script>

</body>
</html>
